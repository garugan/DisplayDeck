[package]
name = "displaydeck-app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "displaydeck_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
display-probe = { path = "../native/display-probe" }
displaydeck-safety = { path = "../native/displaydeck-safety" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
